name: StockDL image

# Builds the all-in-one image for the StockDL fork on every push to the
# `stockdl` branch and publishes it to ghcr.io/<owner>/garage-admin-all.
on:
  push:
    branches: [stockdl]
  workflow_dispatch:

concurrency:
  group: stockdl-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/garage-admin-all
          flavor: latest=false
          tags: |
            type=raw,value=stockdl
            type=sha,prefix=stockdl-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/garage-admin-all.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=stockdl-all
          cache-to: type=gha,mode=max,scope=stockdl-all
